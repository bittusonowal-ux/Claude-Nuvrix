<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="blob1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1200" height="630" fill="#09090B"/>

  <!-- Aurora blobs, matching hero background layers -->
  <rect width="1200" height="630" fill="url(#blob1)"/>
  <rect width="1200" height="630" fill="url(#blob2)"/>

  <!-- Faint grid, matching hero layer 4 -->
  <g opacity="0.04" stroke="#1F2937" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Wordmark -->
  <text x="100" y="290" font-family="Arial, sans-serif" font-weight="700" font-size="88" fill="#FFFFFF">Nuvrix</text>

  <!-- Tagline -->
  <text x="100" y="350" font-family="Arial, sans-serif" font-weight="400" font-size="30" fill="#A1A1AA">AI Automation, Websites &amp; SEO</text>

  <!-- Eyebrow -->
  <text x="100" y="200" font-family="Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="url(#textGrad)">AI AUTOMATION AGENCY · INDIA</text>

  <!-- Bottom accent line -->
  <rect x="100" y="400" width="140" height="4" rx="2" fill="url(#textGrad)"/>
</svg>
